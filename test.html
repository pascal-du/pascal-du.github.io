<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Interactive Graph Network</title>
  <script defer src="dynamic-background.js"></script>
  <style>
    :root {
      --bg-color: #050507;
      --accent-color: #6366f1;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    canvas#network-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .ui-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 2.5rem;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    .nav-links a {
      pointer-events: auto;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text-main);
    }

    main {
      max-width: 650px;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
      background: linear-gradient(180deg, #ffffff 0%, #a5a5a5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
    }

    .btn {
      pointer-events: auto;
      padding: 0.8rem 1.6rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background-color: rgba(99, 102, 241, 0.75);
      color: #ffffff;
      border: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
    }

    footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <canvas id="network-canvas"></canvas>

  <div class="ui-layer">
    <nav>
      <div class="brand">NexusOS</div>
      <div class="nav-links">
        <a href="#features">Architecture</a>
        <a href="#docs">Documentation</a>
        <a href="#contact">Terminal</a>
      </div>
    </nav>

    <main>
      <h1>Decentralized Graph Infrastructure.</h1>
      <p>A real-time, topological computing interface designed to visualize high-dimensional state distribution with sub-millisecond edge resolution.</p>
      <div class="actions">
        <button class="btn btn-primary">Initialize Node</button>
        <button class="btn btn-secondary">Explore Telemetry</button>
      </div>
    </main>

    <footer>
      <span>SYSTEM STATUS: OPERATIONAL</span>
    </footer>
  </div>

</body>
</html>
